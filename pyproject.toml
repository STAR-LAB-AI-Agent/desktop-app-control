[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-ai-agent"
version = "0.1.0"
description = "A vision-driven desktop agent built with PyAutoGUI"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "PyAutoGUI>=0.9.54",
    "pyperclip>=1.9",
]

[project.scripts]
desk-agent = "desktop_agent.cli:main"

[tool.setuptools.packages.find]
include = ["desktop_agent*"]
